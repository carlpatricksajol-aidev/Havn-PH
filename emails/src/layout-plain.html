<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>[[subject]]</title>
<style>
  body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
  a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
  /* A slow glint of light crosses the brass plate, left to right. Mail apps that do not animate show the still photo. */
  .pl-sheen { background-image: linear-gradient(100deg, rgba(255,246,205,0) 42%, rgba(255,246,205,0.45) 50%, rgba(255,246,205,0) 58%); background-repeat: no-repeat; background-size: 250% 100%; background-position: 100% 0; -webkit-animation: pl-sheen 7s ease-in-out infinite; animation: pl-sheen 7s ease-in-out infinite; }
  @-webkit-keyframes pl-sheen { 0%, 50% { background-position: 100% 0; } 100% { background-position: 0% 0; } }
  @keyframes pl-sheen { 0%, 50% { background-position: 100% 0; } 100% { background-position: 0% 0; } }
  @media (prefers-reduced-motion: reduce) { .pl-sheen { -webkit-animation: none; animation: none; } }
  @media only screen and (max-width: 480px) {
    .pl-door { height: 210px !important; }
    .pl-sheen { width: 176px !important; height: 62px !important; }
    .pl-door-code { font-size: 26px !important; line-height: 62px !important; letter-spacing: 7px !important; padding-left: 7px !important; }
    .pl-wrap { padding: 28px 20px 36px !important; }
    .pl-code { font-size: 30px !important; letter-spacing: 6px !important; padding-left: 6px !important; }
  }
  @media (prefers-color-scheme: dark) {
    .pl-page { background-color: #121815 !important; }
    .pl-h1 { color: #F3EEE5 !important; }
    .pl-p { color: #D5D0C6 !important; }
    .pl-box { background-color: #1F2823 !important; }
    .pl-code { color: #F3EEE5 !important; }
    .pl-door-code { color: #2B2110 !important; }
    .pl-small, .pl-foot, .pl-foot-link { color: #9AA19B !important; }
    .pl-line { background-color: #2A342F !important; }
  }
</style>
</head>
<body class="pl-page" style="margin:0;padding:0;width:100%;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">[[preheader]]</div>
<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">[[preheader_filler]]</div>
<table role="presentation" class="pl-page" width="100%" border="0" cellspacing="0" cellpadding="0">
  <tr>
    <td align="center" style="padding:0;">
      <!--[if mso]><table role="presentation" width="[[width]]" align="center" border="0" cellspacing="0" cellpadding="0"><tr><td><![endif]-->
      <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="width:100%;max-width:[[width]]px;">
        <tr>
          <td class="pl-wrap" align="left" style="padding:40px 24px 48px;">
            <a href="{{site_url}}" target="_blank" style="text-decoration:none;"><img class="pl-icon" src="[[icon_url]]" width="40" height="40" alt="ECStay"></a>
[[content]]
            <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="margin:0;"><tr><td style="padding:28px 0 20px;"><table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0"><tr><td class="pl-line" height="1">&nbsp;</td></tr></table></td></tr></table>
            <p class="pl-foot"><a class="pl-foot-link" href="{{site_url}}" target="_blank">ECStay</a> &middot; Rooms and bedspaces in Davao City</p>
            <p class="pl-foot">[[reason]]</p>
          </td>
        </tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td>
  </tr>
</table>
</body>
</html>
