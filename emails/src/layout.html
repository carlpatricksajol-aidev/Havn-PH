<title>[[subject]]</title>

<style>
  body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
  a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
  @media only screen and (max-width: 480px) {
    .outer { padding: 12px 10px 28px !important; }
    .px { padding-left: 22px !important; padding-right: 22px !important; }
    .logo-cell { padding-top: 22px !important; padding-bottom: 20px !important; }
    .content { padding-top: 28px !important; }
    .h1 { font-size: 26px !important; line-height: 32px !important; }
    .plate { padding: 26px 8px 20px !important; }
    .code { font-size: 36px !important; line-height: 44px !important; letter-spacing: 10px !important; padding-left: 10px !important; }
    .btn-table { width: 100% !important; }
    .btn-a { display: block !important; padding-left: 16px !important; padding-right: 16px !important; }
    .alt-link { text-align: center !important; }
    .row-l { width: 88px !important; }
    .listing-img { width: 88px !important; height: 66px !important; }
    .listing-pic { width: 88px !important; padding: 12px 0 12px 12px !important; }
    .listing-txt { padding: 12px 14px !important; }
  }
  @media (prefers-color-scheme: dark) {
    .bg-page { background-color: #0F1713 !important; }
    .card { background-color: #17211C !important; border-color: #2B3832 !important; }
    .h1, .h2, .h3, .sign, .plain, .strong, .item-t, .row-v, .listing-name, .listing-price, .quote-text, .box-big { color: #F3EEE5 !important; }
    .p, .item-p, .box-small { color: #CDC8BE !important; }
    .small, .row-l, .listing-meta, .foot-note, .foot-links { color: #A5ABA5 !important; }
    .label, .num { color: #D6B07A !important; }
    .link { color: #A9CFBE !important; }
    .foot-brand, .foot-link { color: #E4DED3 !important; }
    .line { background-color: #2B3832 !important; }
    .rows, .row-l, .row-v, .listing { border-color: #2B3832 !important; }
    .quote, .box { background-color: #212D27 !important; border-color: #2F3D36 !important; }
    .plate { background-color: #1F4539 !important; }
    .code { color: #F9F6F0 !important; }
    .code-note { color: #C9D8CF !important; }
    .btn-td, .btn-a { background-color: #E6EDE8 !important; color: #132C25 !important; }
    .logo { background-color: #F9F6F0 !important; border-radius: 8px !important; padding: 6px 10px !important; }
  }
</style>
</head>
<body class="bg-page" style="margin:0;padding:0;width:100%;word-spacing:normal;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">[[preheader]]</div>
<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">[[preheader_filler]]</div>
<table role="presentation" class="bg-page" width="100%" border="0" cellspacing="0" cellpadding="0" bgcolor="#F9F6F0">
  <tr>
    <td class="outer" align="center" style="padding:32px 12px 40px;">
      <!--[if mso]><table role="presentation" width="[[width]]" align="center" border="0" cellspacing="0" cellpadding="0"><tr><td><![endif]-->
      <table role="presentation" class="container" width="100%" border="0" cellspacing="0" cellpadding="0" style="width:100%;max-width:[[width]]px;">
        <tr>
          <td class="card" bgcolor="#FFFFFF">
            <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0">
              <tr>
                <td class="px logo-cell" align="left" style="padding:28px 40px 24px;">
                  <a href="{{site_url}}" target="_blank" style="text-decoration:none;"><img class="logo" src="[[logo_url]]" width="[[logo_width]]" height="[[logo_height]]" alt="ECStay"></a>
                </td>
              </tr>
              <tr>
                <td class="px" style="padding:0 40px;">
                  <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0"><tr><td class="line" height="1">&nbsp;</td></tr></table>
                </td>
              </tr>
              <tr>
                <td class="px content" align="left" style="padding:34px 40px 16px;">
[[content]]
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td class="px foot" align="left" style="padding:24px 40px 0;">
            <p class="foot-brand">ECStay &middot; Rooms and bedspaces in Davao City</p>
            <p class="foot-links"><a class="foot-link" href="{{site_url}}/help" target="_blank">Help</a>&nbsp;&nbsp;&middot;&nbsp;&nbsp;<a class="foot-link" href="{{site_url}}/privacy" target="_blank">Privacy</a>&nbsp;&nbsp;&middot;&nbsp;&nbsp;<a class="foot-link" href="{{site_url}}/terms" target="_blank">Terms</a></p>
            [[footer]]
          </td>
        </tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td>
  </tr>
</table>
</body>
</html>
